# GENERATED by the integration workstream - keep every profile in step.
# Schema: dms/config/schema.py (every section forbids unknown keys).
# Thresholds are on the CORRECTED landmark topology; see the note in StateConfig.
# LOW-LATENCY PROFILE. Identical to default.yaml except for the face detector:
# this one runs SCRFD-512 instead of SCRFD-640. It exists so the 512 operating
# point stays available and measurable after the shipped default was reverted
# to 640 on 2026-09-13; it is NOT the default and no golden is recorded against
# it. Read the models.face comment before choosing it - it is a real detection
# quality trade, and it does not reliably meet the 66 ms gate either.
source:
  type: file
  path: tests/replay/day_driver.mp4
  dev: true
  device: /dev/video0
  sensor_id: 0
  width: 1280
  height: 720
  fps: 30
capture:
  full_size: [1280, 720]
  # The detector input this profile expects; the SCRFD engine below is the
  # authority and the app logs LETTERBOX_MISMATCH if they disagree.
  # tests/test_config.py::test_capture_letterbox_describes_the_detector_the_profile_ships
  # keeps the two in step against the MANIFEST input shape, so a future engine
  # swap cannot leave this key behind.
  letterbox: [512, 512]
  letterbox_pad_value: 0
  queue_depth: 1
camera:
  # Replay: a clip that will not open is a hard error, there is nothing to retry.
  fail_fatal: true
  retry_forever: false
  backoff_s: [0.5, 1.0, 2.0, 5.0, 5.0]
  stall_timeout_s: 5.0
  first_frame_timeout_s: 10.0
  starved_below_fps: 0.0
  starved_for_s: 10.0
models:
  face:
    # SCRFD-512, the low-latency operating point. THIS COSTS DETECTION
    # QUALITY. Measured on this board 2026-09-13, both engines through the
    # shipped ScrfdDetector over all 9 replay clips (16,451 frames, conf 0.5),
    # counting frames whose face centre falls in driver_roi [0,0,0.65,1.0]:
    #   clip                    frames   640    512     delta
    #   day_driver                6218  1105    930    -15.8%   <- this profile
    #   family_vacation_crash     1873  1609   1585     -1.5%
    #   rear_end_accident          186   160    153     -4.4%
    #   rear_end_whiplash          528   263    257     -2.3%
    #   minivan                   1440  1431   1416     -1.0%
    #   red_car_crash             2808  2767   2743     -0.9%
    #   bmw_rear_ended             398   297    297     +0.0%
    #   guy_rear_ended            1830     0      0     +0.0%  (no face found)
    #   getting_rear_ended        1170  1091   1105     +1.3%
    #   TOTAL                    16451  8723   8486     -2.7%
    # 98% of the 176 day_driver frames 512 loses are >= 60 px wide (median
    # 75 px) - the DRIVER at medium range, not background faces. Downstream:
    # over the same 300 frames of day_driver, driver_changed enter/exit goes
    # 2 (640) -> 10 (512) against a golden band of [1, 3]; the identity layer
    # re-acquires the driver five times more often. The longest run of frames
    # on which 512 loses the driver is 11 (~0.37 s at 30 fps), short of the
    # 1.0 s face_lost_s dwell, so it does not raise FACE_LOST on its own.
    #
    # What it buys, measured as a paired A/B against default.yaml - 6 pairs of
    # 300 frames, alternating which engine ran first, because two sequential
    # sweeps on this board disagreed about the SIGN of the difference:
    #   e2e p95 median   640 79.55 ms   512 74.39 ms   paired delta +7.44 ms
    #   e2e p50 median   640 52.25 ms   512 47.40 ms   paired delta +5.40 ms
    #   runs inside the 66.0 ms gate    640 0 of 6     512 0 of 6
    # So the saving is real (and reproduces the -5.6 ms p50 that docs/
    # performance.md s.7 predicted) and it is NOT enough: the median run has to
    # come down by about 13 ms to meet the gate. Choosing this profile does not
    # make the unit compliant. It makes it faster and less accurate, and the
    # PERF_GATE line will still say FAIL when it misses.
    engine: engines/scrfd_500m_512_fp16_gpu.engine
    conf: 0.5
    iou: 0.4
    device: gpu
  landmarks:
    engine: engines/2d106det_192_fp16_gpu.engine
    device: gpu
  backends:
    headpose: model
    eyestate: model
    mouthstate: model
    occlusion: model
    # Gaze360 weights are research/non-commercial. Never 'model' in production.
    gaze: 'off'
    objects: model
    identity: model
  research_models_allowed: false
  eyestate:
    prob_open_threshold: 0.50
    ear_closed: 0.18
    crop_margin: 0.0
    # Below this eye width the OCEC classifier was MEASURED to invert; the
    # wrapper falls through to the geometric EAR under the floor.
    min_eye_box_px: 20.0
  mouthstate:
    prob_open_threshold: 0.50
    mar_open: 0.25
    min_mouth_box_px: 30.0
  occlusion:
    sunglasses_threshold: 0.50
    mask_threshold: 0.50
    head_box_expand: 0.25
    every_n: 15
  objects:
    roi: [0.0, 0.45, 1.0, 1.0]
    classes: [cell phone]
    conf: 0.30
    iou: 0.45
    # 20, not 10: at every 10th frame the pipeline p95 lands on an object-net
    # frame and goes from 62.2 ms (pass) to 77.6 ms (fail).
    every_n: 20
  identity:
    cosine_threshold: 0.363
    max_identities: 8
    refresh_n: 150
state:
  # --- eyes (corrected roll-invariant EAR: 0.21-0.40 on OPEN eyes)
  ear_closed: 0.18
  ear_open_median: 0.27
  eye_prob_closed: 0.40
  eye_prob_open: 0.55
  ear_hysteresis: 0.03
  eye_close_dwell_s: 0.15
  eye_open_dwell_s: 0.10
  # --- mouth (inner-lip MAR: ~0.01 closed, median 0.115 talking)
  mar_yawn: 0.45
  mar_close: 0.35
  mouth_prob_open: 0.50
  mouth_prob_closed: 0.40
  # --- pose / gaze
  pose_min_conf: 0.35
  pose_max_reproj_px: 6.0
  gaze_min_conf: 0.40
  gaze_yaw_deg: 25.0
  gaze_pitch_deg: 20.0
  # --- occlusion gates
  sunglasses_thr: 0.50
  mask_thr: 0.50
  # --- PERCLOS
  perclos_warn: 0.20
  perclos_crit: 0.40
  perclos_window_s: 60.0
  perclos_min_span_s: 30.0
  perclos_min_rate_hz: 8.0
  perclos_min_coverage: 0.6
  perclos_exit_margin: 0.05
  perclos_enter_s: 2.0
  perclos_exit_s: 10.0
  perclos_cooldown_s: 30.0
  # --- timing
  max_gap_s: 0.5
  stale_after_s: 0.5
  # --- presence
  face_lost_s: 1.0
  face_lost_exit_s: 0.40
  face_lost_cooldown_s: 5.0
  face_lost_crit_s: 3.0
  no_driver_grace_s: 10.0
  # --- microsleep
  microsleep_s: 1.5
  microsleep_exit_s: 0.20
  microsleep_cooldown_s: 10.0
  # --- yawn / fatigue
  yawn_enter_s: 0.40
  yawn_exit_s: 0.0
  yawn_cooldown_s: 15.0
  fatigue_yawns: 3
  fatigue_window_s: 180.0
  fatigue_exit_s: 0.0
  fatigue_cooldown_s: 30.0
  # --- gaze away
  gaze_warn_s: 2.0
  gaze_crit_s: 4.0
  gaze_exit_s: 0.50
  gaze_cooldown_s: 5.0
  # --- phone / distraction
  phone_conf: 0.50
  phone_enter_s: 0.80
  phone_exit_s: 0.40
  phone_cooldown_s: 10.0
  distraction_gaze_s: 6.0
  distraction_phone_s: 1.5
  distraction_exit_s: 1.5
  distraction_cooldown_s: 20.0
  # --- honesty alerts
  unreliable_enter_s: 1.0
  unreliable_exit_s: 2.0
  unreliable_cooldown_s: 20.0
  degraded_enter_s: 2.0
  degraded_exit_s: 5.0
  degraded_cooldown_s: 60.0
  # --- global
  assume_moving: true
  leak: 1.0
alerts:
  gpio_pin: null
  buzzer: false
  mute_when_parked: false
clips:
  enabled: false
  dir: /var/lib/dms/clips
  pre_s: 10.0
  post_s: 5.0
  segment_s: 10.0
  quota_mb: 2048
  retain_h: 24
  ffmpeg: /usr/bin/ffmpeg
  bitrate: 4000000
  min_free_mb: 256.0
events:
  enabled: true
  path: data/events.jsonl
  fsync: critical
  fsync_interval_s: 1.0
  max_mb: 64.0
  backups: 2
  min_free_mb: 64.0
  strict: false
display:
  enabled: false
  scale: 0.5
privacy:
  record_faces: false
  telemetry: false
health:
  bind: 127.0.0.1
  port: 8088
  allow_remote: false
  token_file: ''
  max_connections: 16
  required: false
  stale_after_s: 5.0
power:
  nvpmodel: 8
  jetson_clocks: false
perf:
  window: 300
  gate_e2e_p95_ms: 66.0
  gate_peak_rss_mb: 5000.0
  targets: {}
driver_roi: [0.0, 0.0, 0.65, 1.0]
driver_fallback: true
forward_zero:
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
seat: lhd
calibration: vehicle.yaml
require_engines: false
