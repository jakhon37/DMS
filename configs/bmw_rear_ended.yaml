# GENERATED by the integration workstream - keep every profile in step.
# Schema: dms/config/schema.py (every section forbids unknown keys).
# Thresholds are on the CORRECTED landmark topology; see the note in StateConfig.
# BMW rear ended: single driver on the RIGHT with the wheel visible.
source:
  type: file
  path: tests/replay/bmw_rear_ended.mp4
  dev: true
  device: /dev/video0
  sensor_id: 0
  width: 1280
  height: 720
  fps: 30
capture:
  full_size: [1280, 720]
  # The detector input this profile expects; the SCRFD engine below is the
  # authority and the app logs LETTERBOX_MISMATCH if they disagree.
  # tests/test_config.py::test_capture_letterbox_describes_the_detector_the_profile_ships
  # keeps the two in step against the MANIFEST input shape, so a future engine
  # swap cannot leave this key behind.
  letterbox: [640, 640]
  letterbox_pad_value: 0
  queue_depth: 1
camera:
  # Replay: a clip that will not open is a hard error, there is nothing to retry.
  fail_fatal: true
  retry_forever: false
  backoff_s: [0.5, 1.0, 2.0, 5.0, 5.0]
  stall_timeout_s: 5.0
  first_frame_timeout_s: 10.0
  starved_below_fps: 0.0
  starved_for_s: 10.0
models:
  face:
    # SCRFD-640. The 512 engine was adopted on 2026-09-13 to buy latency and
    # REVERTED the same day: it did not reliably buy the pass it was made for,
    # and it cost real detection quality. Both halves were re-measured; the
    # tables live in docs/performance.md section 7 and are NOT duplicated here,
    # because the duplicated version of this comment went stale in twelve files
    # at once. The short version, all measured on this board:
    #   * quality, all 9 replay clips (16,451 frames, conf 0.5, driver_roi
    #     [0,0,0.65,1.0]): frames with a face in the driver ROI 8723 (640) ->
    #     8486 (512), -2.7% overall and -15.8% on day_driver (1105 -> 930).
    #     98% of what 512 drops on day_driver is >= 60 px wide, median 75 px:
    #     that is the driver at medium range, not a background face.
    #   * behaviour: day_driver driver_changed enter/exit 2 (640) -> 10 (512)
    #     over the same 300 frames, against a golden band of [1, 3]. Three of
    #     the nine golden fixtures went red on 512.
    #   * latency: NEITHER engine meets perf.gate_e2e_p95_ms on this board, so
    #     the swap did not buy the pass it was made for. Paired A/B, 6 pairs of
    #     300 frames alternating which engine ran first (sequential sweeps on
    #     this board are not comparable - two of them disagreed on the SIGN of
    #     the difference): 640 e2e p95 median 79.55 ms, 512 74.39 ms, and
    #     0 of 6 runs passed on EITHER engine. The 512 is worth 5.4 ms of p50;
    #     the gap to the gate is about 13 ms. Per-profile run-to-run spread is
    #     6.5-33 ms, wider than the margin the gate is judged by, so a single
    #     PASS is not evidence of a pass. The miss is REPORTED (PERF_GATE line,
    #     /healthz note and e2e_p95_limit, dms_perf_gate_* gauges) and declared
    #     in tests/test_config.py::KNOWN_GATE_MISSES, not designed around.
    # Need the low-latency point instead? configs/lowlatency.yaml carries the
    # 512 engine with the same quality cost stated in its own header.
    engine: engines/scrfd_500m_640_fp16_gpu.engine
    conf: 0.40
    iou: 0.4
    device: gpu
  landmarks:
    engine: engines/2d106det_192_fp16_gpu.engine
    device: gpu
  backends:
    headpose: model
    eyestate: model
    mouthstate: model
    occlusion: model
    # Gaze360 weights are research/non-commercial. Never 'model' in production.
    gaze: 'off'
    objects: model
    identity: model
  research_models_allowed: false
  eyestate:
    prob_open_threshold: 0.50
    ear_closed: 0.18
    crop_margin: 0.0
    # Below this eye width the OCEC classifier was MEASURED to invert; the
    # wrapper falls through to the geometric EAR under the floor.
    min_eye_box_px: 20.0
  mouthstate:
    prob_open_threshold: 0.50
    mar_open: 0.25
    min_mouth_box_px: 30.0
  occlusion:
    sunglasses_threshold: 0.50
    mask_threshold: 0.50
    head_box_expand: 0.25
    every_n: 15
  objects:
    roi: [0.0, 0.45, 1.0, 1.0]
    classes: [cell phone]
    conf: 0.30
    iou: 0.45
    # 20, not 10: at every 10th frame the pipeline p95 lands on an object-net
    # frame and goes from 62.2 ms (pass) to 77.6 ms (fail).
    every_n: 20
  identity:
    cosine_threshold: 0.363
    max_identities: 8
    refresh_n: 150
state:
  # --- eyes (corrected roll-invariant EAR: 0.21-0.40 on OPEN eyes)
  ear_closed: 0.18
  ear_open_median: 0.27
  eye_prob_closed: 0.40
  eye_prob_open: 0.55
  ear_hysteresis: 0.03
  eye_close_dwell_s: 0.15
  eye_open_dwell_s: 0.10
  # --- mouth (inner-lip MAR: ~0.01 closed, median 0.115 talking)
  mar_yawn: 0.45
  mar_close: 0.35
  mouth_prob_open: 0.50
  mouth_prob_closed: 0.40
  # --- pose / gaze
  pose_min_conf: 0.35
  pose_max_reproj_px: 6.0
  gaze_min_conf: 0.40
  gaze_yaw_deg: 25.0
  gaze_pitch_deg: 20.0
  # --- occlusion gates
  sunglasses_thr: 0.50
  mask_thr: 0.50
  # --- PERCLOS
  perclos_warn: 0.20
  perclos_crit: 0.40
  perclos_window_s: 60.0
  perclos_min_span_s: 30.0
  perclos_min_rate_hz: 8.0
  perclos_min_coverage: 0.6
  perclos_exit_margin: 0.05
  perclos_enter_s: 2.0
  perclos_exit_s: 10.0
  perclos_cooldown_s: 30.0
  # --- timing
  max_gap_s: 0.5
  stale_after_s: 0.5
  # --- presence
  face_lost_s: 1.0
  face_lost_exit_s: 0.40
  face_lost_cooldown_s: 5.0
  face_lost_crit_s: 3.0
  no_driver_grace_s: 10.0
  # --- microsleep
  microsleep_s: 1.5
  microsleep_exit_s: 0.20
  microsleep_cooldown_s: 10.0
  # --- yawn / fatigue
  yawn_enter_s: 0.40
  yawn_exit_s: 0.0
  yawn_cooldown_s: 15.0
  fatigue_yawns: 3
  fatigue_window_s: 180.0
  fatigue_exit_s: 0.0
  fatigue_cooldown_s: 30.0
  # --- gaze away
  gaze_warn_s: 2.0
  gaze_crit_s: 4.0
  gaze_exit_s: 0.50
  gaze_cooldown_s: 5.0
  # --- phone / distraction
  phone_conf: 0.50
  phone_enter_s: 0.80
  phone_exit_s: 0.40
  phone_cooldown_s: 10.0
  distraction_gaze_s: 6.0
  distraction_phone_s: 1.5
  distraction_exit_s: 1.5
  distraction_cooldown_s: 20.0
  # --- honesty alerts
  unreliable_enter_s: 1.0
  unreliable_exit_s: 2.0
  unreliable_cooldown_s: 20.0
  degraded_enter_s: 2.0
  degraded_exit_s: 5.0
  degraded_cooldown_s: 60.0
  # --- global
  assume_moving: true
  leak: 1.0
alerts:
  gpio_pin: null
  buzzer: false
  mute_when_parked: false
clips:
  enabled: false
  dir: /var/lib/dms/clips
  pre_s: 10.0
  post_s: 5.0
  segment_s: 10.0
  quota_mb: 2048
  retain_h: 24
  ffmpeg: /usr/bin/ffmpeg
  bitrate: 4000000
  min_free_mb: 256.0
events:
  enabled: true
  path: data/events.jsonl
  fsync: critical
  fsync_interval_s: 1.0
  max_mb: 64.0
  backups: 2
  min_free_mb: 64.0
  strict: false
display:
  enabled: false
  scale: 0.5
privacy:
  record_faces: false
  telemetry: false
health:
  bind: 127.0.0.1
  port: 8088
  allow_remote: false
  token_file: ''
  max_connections: 16
  required: false
  stale_after_s: 5.0
power:
  nvpmodel: 8
  jetson_clocks: false
perf:
  window: 300
  gate_e2e_p95_ms: 66.0
  gate_peak_rss_mb: 5000.0
  targets: {}
driver_roi: [0.50, 0.15, 1.0, 1.0]
driver_fallback: false
forward_zero:
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
seat: lhd
calibration: vehicle.yaml
require_engines: false
