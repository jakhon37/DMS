# GENERATED by the integration workstream - keep every profile in step.
# Schema: dms/config/schema.py (every section forbids unknown keys).
# Thresholds are on the CORRECTED landmark topology; see the note in StateConfig.
# Smoke profile: videotestsrc, no engines required, nothing written to disk.
# Used by the CI-style command in readme.md to prove the process starts.
source:
  type: test
  path: ''
  dev: true
  device: /dev/video0
  sensor_id: 0
  width: 1280
  height: 720
  fps: 30
capture:
  full_size: [1280, 720]
  # The detector input this profile expects; the SCRFD engine below is the
  # authority and the app logs LETTERBOX_MISMATCH if they disagree.
  letterbox: [512, 512]
  letterbox_pad_value: 0
  queue_depth: 1
camera:
  fail_fatal: false
  retry_forever: false
  backoff_s: [0.5, 1.0, 2.0, 5.0, 5.0]
  stall_timeout_s: 5.0
  first_frame_timeout_s: 10.0
  starved_below_fps: 0.0
  starved_for_s: 10.0
models:
  face:
    # SCRFD-512, not 640. MEASURED on this board 2026-09-13 (nvpmodel 8, 400
    # replay frames, back to back on an otherwise idle board, all nine engines):
    #   default.yaml  640: e2e p95 71.63 ms FAIL @18.2 FPS -> 512: 63.08 ms PASS @19.4
    #   minivan.yaml  640: e2e p95 73.56 ms FAIL @17.9 FPS -> 512: 61.90 ms PASS @20.6
    # perf.gate_e2e_p95_ms is 66.0, so the 640 engine cannot pass the gate this
    # profile declares. 512 is the only change that brings the shipped pipeline
    # inside it without removing a model. The tail is close to the limit: a
    # second heavy process on the six CPU cores adds 5-8 ms to the p95 and the
    # gate fails again - the app now reports that instead of hiding it.
    # It is a REAL, ACCEPTED recall degrade on small far faces, not a free win.
    # Measured over the 9 replay clips in tests/replay (1986 frames, conf 0.5),
    # by running ScrfdDetector with each engine and comparing per frame:
    #   * frames with a face inside driver_roi: 1444 (640) -> 1421 (512), -1.6%.
    #     Worst: day_driver -12/155 (-7.7%), rear_end_accident -9/160 (-5.6%).
    #     minivan, red_car_crash and family_vacation_crash lose nothing.
    #   * driver-box agreement where both find one: mean IoU 0.77-0.95 per clip.
    #   * all detections: 3585 -> 3379. 82% of what 512 drops is under 60 px wide
    #     - background/passenger faces on the dashcam montage, not the driver,
    #     whose box is 65-146 px wide in these clips.
    # If your cabin puts the driver's face under ~60 px wide, use the 640 engine
    # and raise perf.gate_e2e_p95_ms to a number you have actually measured.
    engine: engines/scrfd_500m_512_fp16_gpu.engine
    conf: 0.5
    iou: 0.4
    device: gpu
  landmarks:
    engine: engines/2d106det_192_fp16_gpu.engine
    device: gpu
  backends:
    headpose: model
    eyestate: model
    mouthstate: model
    occlusion: model
    # Gaze360 weights are research/non-commercial. Never 'model' in production.
    gaze: 'off'
    objects: model
    identity: model
  research_models_allowed: false
  eyestate:
    prob_open_threshold: 0.50
    ear_closed: 0.18
    crop_margin: 0.0
    # Below this eye width the OCEC classifier was MEASURED to invert; the
    # wrapper falls through to the geometric EAR under the floor.
    min_eye_box_px: 20.0
  mouthstate:
    prob_open_threshold: 0.50
    mar_open: 0.25
    min_mouth_box_px: 30.0
  occlusion:
    sunglasses_threshold: 0.50
    mask_threshold: 0.50
    head_box_expand: 0.25
    every_n: 15
  objects:
    roi: [0.0, 0.45, 1.0, 1.0]
    classes: [cell phone]
    conf: 0.30
    iou: 0.45
    # 20, not 10: at every 10th frame the pipeline p95 lands on an object-net
    # frame and goes from 62.2 ms (pass) to 77.6 ms (fail).
    every_n: 20
  identity:
    cosine_threshold: 0.363
    max_identities: 8
    refresh_n: 150
state:
  # --- eyes (corrected roll-invariant EAR: 0.21-0.40 on OPEN eyes)
  ear_closed: 0.18
  ear_open_median: 0.27
  eye_prob_closed: 0.40
  eye_prob_open: 0.55
  ear_hysteresis: 0.03
  eye_close_dwell_s: 0.15
  eye_open_dwell_s: 0.10
  # --- mouth (inner-lip MAR: ~0.01 closed, median 0.115 talking)
  mar_yawn: 0.45
  mar_close: 0.35
  mouth_prob_open: 0.50
  mouth_prob_closed: 0.40
  # --- pose / gaze
  pose_min_conf: 0.35
  pose_max_reproj_px: 6.0
  gaze_min_conf: 0.40
  gaze_yaw_deg: 25.0
  gaze_pitch_deg: 20.0
  # --- occlusion gates
  sunglasses_thr: 0.50
  mask_thr: 0.50
  # --- PERCLOS
  perclos_warn: 0.20
  perclos_crit: 0.40
  perclos_window_s: 60.0
  perclos_min_span_s: 30.0
  perclos_min_rate_hz: 8.0
  perclos_min_coverage: 0.6
  perclos_exit_margin: 0.05
  perclos_enter_s: 2.0
  perclos_exit_s: 10.0
  perclos_cooldown_s: 30.0
  # --- timing
  max_gap_s: 0.5
  stale_after_s: 0.5
  # --- presence
  face_lost_s: 1.0
  face_lost_exit_s: 0.40
  face_lost_cooldown_s: 5.0
  face_lost_crit_s: 3.0
  no_driver_grace_s: 10.0
  # --- microsleep
  microsleep_s: 1.5
  microsleep_exit_s: 0.20
  microsleep_cooldown_s: 10.0
  # --- yawn / fatigue
  yawn_enter_s: 0.40
  yawn_exit_s: 0.0
  yawn_cooldown_s: 15.0
  fatigue_yawns: 3
  fatigue_window_s: 180.0
  fatigue_exit_s: 0.0
  fatigue_cooldown_s: 30.0
  # --- gaze away
  gaze_warn_s: 2.0
  gaze_crit_s: 4.0
  gaze_exit_s: 0.50
  gaze_cooldown_s: 5.0
  # --- phone / distraction
  phone_conf: 0.50
  phone_enter_s: 0.80
  phone_exit_s: 0.40
  phone_cooldown_s: 10.0
  distraction_gaze_s: 6.0
  distraction_phone_s: 1.5
  distraction_exit_s: 1.5
  distraction_cooldown_s: 20.0
  # --- honesty alerts
  unreliable_enter_s: 1.0
  unreliable_exit_s: 2.0
  unreliable_cooldown_s: 20.0
  degraded_enter_s: 2.0
  degraded_exit_s: 5.0
  degraded_cooldown_s: 60.0
  # --- global
  assume_moving: true
  leak: 1.0
alerts:
  gpio_pin: null
  buzzer: false
  mute_when_parked: false
clips:
  enabled: false
  dir: /var/lib/dms/clips
  pre_s: 10.0
  post_s: 5.0
  segment_s: 10.0
  quota_mb: 2048
  retain_h: 24
  ffmpeg: /usr/bin/ffmpeg
  bitrate: 4000000
  min_free_mb: 256.0
events:
  enabled: false
  path: data/events.jsonl
  fsync: critical
  fsync_interval_s: 1.0
  max_mb: 64.0
  backups: 2
  min_free_mb: 64.0
  strict: false
display:
  enabled: false
  scale: 0.5
privacy:
  record_faces: false
  telemetry: false
health:
  bind: 127.0.0.1
  port: 8088
  allow_remote: false
  token_file: ''
  max_connections: 16
  required: false
  stale_after_s: 5.0
power:
  nvpmodel: 8
  jetson_clocks: false
perf:
  window: 300
  gate_e2e_p95_ms: 66.0
  gate_peak_rss_mb: 5000.0
  targets: {}
driver_roi: [0.0, 0.0, 0.65, 1.0]
driver_fallback: true
forward_zero:
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
seat: lhd
calibration: vehicle.yaml
require_engines: false
