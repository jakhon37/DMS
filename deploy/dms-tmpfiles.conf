# /etc/tmpfiles.d/dms.conf — ownership and mode for the DMS state locations.
#
# systemd's StateDirectory=/RuntimeDirectory=/LogsDirectory= in dms.service already
# create these when the unit starts. This file exists so the directories are correct
# *before* first start too — an operator who runs the app by hand, a log shipper that
# reads /var/log/dms, or logrotate's `su dms dms` on a unit that has never run.
#
# 0750, not the 0755 systemd would default to: /var/lib/dms/events.jsonl is the
# driver's complete drowsiness, microsleep and distraction history and must not be
# readable by every local account on the vehicle head unit.
#
# /var/lib/dms/clips is deliberately absent. It is created by dms/io/clips.py only
# when clips.enabled AND privacy.record_faces are both true, so a default install
# leaves no directory suggesting that in-cabin video is being recorded.
#
# Apply without a reboot:  systemd-tmpfiles --create /etc/tmpfiles.d/dms.conf

#Type Path            Mode UID  GID  Age Argument
d     /var/lib/dms    0750 dms  dms  -
d     /var/log/dms    0750 dms  dms  -
d     /run/dms        0750 dms  dms  -

# Re-apply the mode to an events file created before UMask=0027 was in the unit.
z     /var/lib/dms/events.jsonl 0640 dms dms -
